# Android 打包：APK + AAB。
#
# 触发：
# - 推送 `v*` tag → 打包并自动创建 GitHub Release（附安装包）
# - 手动触发（workflow_dispatch）→ 只产出 artifact
#
# 签名（必需）：release 构建强制正式签名（gradle 无 key.properties 直接失败）。
# v1.0–v1.6 未配置 Secrets、回退 debug 签名：CI 每次运行 debug 证书都不同，
# 导致覆盖安装全部报「签名不正确」。必须配置以下 Secrets（与本地 android/key.properties 同一把 key）：
#
#   ANDROID_KEYSTORE_BASE64   keystore 文件 base64（android/app/upload-keystore.jks）
#   ANDROID_KEYSTORE_PASSWORD keystore 密码
#   ANDROID_KEY_PASSWORD      key 密码
#   ANDROID_KEY_ALIAS         key 别名
name: Build Android

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.1.0

      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: jdx/mise-action@v4.3.0
        with:
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare release signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Build APK (universal)
        run: flutter build apk --release

      # 按 ABI 拆包：每个 APK 只含单一架构（arm64-v8a / armeabi-v7a / x86_64），
      # 体积约为整包的 1/3～1/2，用户按设备架构下载即可（主流手机选 arm64-v8a）。
      - name: Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Build App Bundle
        run: flutter build appbundle --release

      # 附件命名：zhiheng-<version>-<架构>.apk（universal = 全部 ABI 整包；
      # arm64-v8a / armeabi-v7a / x86_64 = 单架构拆包）+ zhiheng-<version>.aab；
      # 版本号带 build（+N），同一版本补发不重名。规范见 docs/约束性文档.md §10。
      - name: Read version
        id: version
        run: |
          echo "version=$(grep '^version:' pubspec.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Rename artifacts
        run: |
          cd build/app/outputs
          mv flutter-apk/app-release.apk \
            "flutter-apk/zhiheng-${{ steps.version.outputs.version }}-universal.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mv "flutter-apk/app-${abi}-release.apk" \
              "flutter-apk/zhiheng-${{ steps.version.outputs.version }}-${abi}.apk"
          done
          mv bundle/release/app-release.aab \
            "bundle/release/zhiheng-${{ steps.version.outputs.version }}.aab"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6.0.0
        with:
          name: zhiheng-android-${{ steps.version.outputs.version }}
          path: |
            build/app/outputs/flutter-apk/zhiheng-${{ steps.version.outputs.version }}-universal.apk
            build/app/outputs/flutter-apk/zhiheng-${{ steps.version.outputs.version }}-arm64-v8a.apk
            build/app/outputs/flutter-apk/zhiheng-${{ steps.version.outputs.version }}-armeabi-v7a.apk
            build/app/outputs/flutter-apk/zhiheng-${{ steps.version.outputs.version }}-x86_64.apk
            build/app/outputs/bundle/release/zhiheng-${{ steps.version.outputs.version }}.aab

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3.0.3
        with:
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/zhiheng-${{ steps.version.outputs.version }}-universal.apk
            build/app/outputs/flutter-apk/zhiheng-${{ steps.version.outputs.version }}-arm64-v8a.apk
            build/app/outputs/flutter-apk/zhiheng-${{ steps.version.outputs.version }}-armeabi-v7a.apk
            build/app/outputs/flutter-apk/zhiheng-${{ steps.version.outputs.version }}-x86_64.apk
            build/app/outputs/bundle/release/zhiheng-${{ steps.version.outputs.version }}.aab
