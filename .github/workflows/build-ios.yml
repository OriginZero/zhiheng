# iOS 打包：未签名 Runner 产物。
#
# 当前阶段没有 Apple 开发者证书，产出 `--no-codesign` 的构建产物，
# 用于验证 iOS 编译；正式签名 / TestFlight 发布在拿到证书后补充。
#
# 触发：推送 `v*` tag 或手动。
name: Build iOS

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5.1.0

      - uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - uses: jdx/mise-action@v4.3.0
        with:
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Read version
        id: version
        run: |
          echo "version=$(grep '^version:' pubspec.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Package Runner.app
        run: |
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qry "zhiheng-ios-${{ steps.version.outputs.version }}-unsigned.zip" Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v6.0.0
        with:
          name: zhiheng-ios-${{ steps.version.outputs.version }}-unsigned
          path: zhiheng-ios-${{ steps.version.outputs.version }}-unsigned.zip
